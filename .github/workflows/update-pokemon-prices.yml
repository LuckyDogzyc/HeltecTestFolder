name: Update Pokémon Prices

on:
  schedule:
    - cron: '0 3 * * *' # 每天 UTC 03:00 运行一次，可按需调整
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Download and generate all configured Pokémon sources
        run: |
          python update_card_sources.py --sleep 0.2

      - name: Commit and push updated data files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add cards update_card_sources.py download_pokemon_tcgcsv_json.py generate_epaper_cards_json.py generate_product_id_buckets.py generate_search_index.py
          if git diff --cached --quiet; then
            echo "No changes detected."
          else
            git commit -m "Update Pokémon card prices via TCGCSV JSON"
            git push
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
